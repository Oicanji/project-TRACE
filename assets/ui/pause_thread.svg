<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="goldThread" x1="16%" y1="68%" x2="88%" y2="38%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.12"/>
      <stop offset="22%" stop-color="#F7DA8C" stop-opacity="0.52"/>
      <stop offset="56%" stop-color="#FFEBB0" stop-opacity="0.42"/>
      <stop offset="86%" stop-color="#FFDE78" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFDF0" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="goldThreadSoft" x1="16%" y1="68%" x2="88%" y2="38%">
      <stop offset="0%" stop-color="#F7D57E" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#F7D57E" stop-opacity="0.16"/>
      <stop offset="78%" stop-color="#FFE69A" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFDF0" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Soft outer glow path (ThorVG-safe pure stroked paths) -->
  <path d="M 275 510 C 425 535, 595 518, 765 445 C 895 390, 990 345, 1070 305"
        fill="none" stroke="url(#goldThreadSoft)" stroke-width="10" stroke-linecap="round"/>

  <!-- Primary delicate golden thread connecting cat side to golden soul -->
  <path d="M 275 510 C 425 535, 595 518, 765 445 C 895 390, 990 345, 1070 305"
        fill="none" stroke="url(#goldThread)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Subtle secondary wisp arc near the golden soul -->
  <path d="M 795 458 C 912 412, 1002 382, 1096 346"
        fill="none" stroke="url(#goldThread)" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>

  <!-- Tiny golden motes along the thread -->
  <circle cx="430" cy="521" r="2.2" fill="#FFF1C2" opacity="0.55"/>
  <circle cx="742" cy="454" r="2.6" fill="#FFE7A0" opacity="0.65"/>
  <circle cx="912" cy="382" r="2.0" fill="#FFF5D6" opacity="0.72"/>
  <circle cx="988" cy="347" r="1.8" fill="#FFE38A" opacity="0.62"/>
</svg>
